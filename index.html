<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theo Dõi Calo AI</title>
    
    <!-- CẤU HÌNH PWA ĐỂ CÀI ĐẶT THÀNH APP ĐIỆN THOẠI -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2ecc71">
    <!-- Bạn nhớ thay đổi link my-logo.png bằng tên file logo của bạn nhé -->
    <link rel="apple-touch-icon" href="./my-logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --text-main: #333333; --text-muted: #555555;
            --green: #2ecc71; --orange: #e67e22; --blue: #3498db; --red: #e74c3c; --border: #e0e0e0;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        
        /* 1. THIẾT LẬP ẢNH NỀN CHO TOÀN TRANG */
        body { 
            background-image: url('./IMG_3173.jpeg'); /* Link tới ảnh nền của bạn */
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; /* Giữ ảnh đứng yên khi cuộn trang */
            color: var(--text-main); 
            padding: 20px; 
            line-height: 1.6; 
        }
        
        .container { max-width: 900px; margin: 0 auto; }
        
        /* Tiêu đề và Câu chào */
        h1 { text-align: center; margin-bottom: 5px; color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.7); font-size: 28px;}
        .greeting { text-align: center; color: rgba(255,255,255,0.9); text-shadow: 0 1px 5px rgba(0,0,0,0.5); font-style: italic; margin-bottom: 20px; font-size: 14px; }
        
        .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        
        /* 2. HIỆU ỨNG KÍNH MỜ (GLASSMORPHISM) CHO CÁC THẺ KPI */
        .card { 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            color: white; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.2); 
            backdrop-filter: blur(8px); /* Làm mờ ảnh nền phía sau */
            -webkit-backdrop-filter: blur(8px); /* Hỗ trợ iPhone/Safari */
            border: 1px solid rgba(255, 255, 255, 0.3); /* Đường viền kính mỏng */
        }
        .card h3 { font-size: 14px; text-transform: uppercase; margin-bottom: 10px; opacity: 0.9; text-shadow: 0 1px 3px rgba(0,0,0,0.3); }
        .card p { font-size: 28px; font-weight: bold; text-shadow: 0 2px 5px rgba(0,0,0,0.3); }
        
        /* Chuyển màu nền đặc sang màu trong suốt (RGBA) */
        .card.in { background: rgba(46, 204, 113, 0.65); } 
        .card.out { background: rgba(230, 126, 34, 0.65); } 
        .card.net { background: rgba(52, 152, 219, 0.65); } 
        
        /* 3. LÀM TRONG SUỐT BẢNG MACROS VÀ KHU VỰC NHẬP LIỆU */
        .macros-summary, .section { 
            background: rgba(255, 255, 255, 0.85); /* Nền trắng trong suốt 85% */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.15); 
        }
        .macros-summary { display: flex; justify-content: space-around; text-align: center; margin-bottom: 30px; }
        .macro-item span { display: block; font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: bold;}
        .macro-item strong { font-size: 18px; color: var(--text-main); }
        .macro-p strong { color: var(--red); } .macro-c strong { color: var(--blue); } .macro-f strong { color: var(--orange); }

        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        @media (max-width: 768px) { .main-grid { grid-template-columns: 1fr; } }
        .section h2 { font-size: 18px; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,0.1); color: #2c3e50; }
        
        .form-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .macro-inputs, .workout-inputs { display: flex; gap: 10px; }
        input { padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; width: 100%; background: rgba(255,255,255,0.9); }
        input:focus { border-color: var(--blue); background: #fff; }
        
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-add-food { background: var(--green); } 
        .btn-add-workout { background: var(--orange); }
        .btn-ai-calc { background: var(--blue); color: white; white-space: nowrap; font-size: 13px; }

        .ai-camera-btn { display: block; width: 100%; text-align: center; padding: 15px; background: rgba(248, 249, 250, 0.7); border: 2px dashed var(--blue); color: var(--blue); border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 15px; transition: all 0.2s; backdrop-filter: blur(5px); }
        .ai-camera-btn:hover { background: rgba(255, 255, 255, 0.9); }
        input[type="file"] { display: none; }
        #ai-status { font-size: 13px; color: var(--text-main); text-align: center; margin-bottom: 15px; display: none; font-weight: bold; }

        .list-header { font-weight: bold; font-size: 14px; color: var(--text-muted); margin-bottom: 10px; }
        ul { list-style: none; max-height: 250px; overflow-y: auto; }
        li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 14px; }
        .item-details span { display: block; font-weight: 500; }
        .item-macros { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
        .del-btn { color: #e74c3c; cursor: pointer; font-weight: bold; margin-left: 10px; font-size: 16px; border: none; background: none; padding: 0;}
    </style>
</head>
<body>

<div class="container">
    <h1>Theo Dõi Calo AI</h1>
    <p class="greeting" id="greeting-text">Đang nạp năng lượng...</p>

    <div class="summary">
        <div class="card in"><h3>Nạp vào</h3><p id="total-in">0 kcal</p></div>
        <div class="card out"><h3>Tiêu thụ</h3><p id="total-out">0 kcal</p></div>
        <div class="card net"><h3>Thực nhận</h3><p id="total-net">0 kcal</p></div>
    </div>

    <div class="macros-summary">
        <div class="macro-item macro-p"><span>Protein</span><strong id="total-protein">0g</strong></div>
        <div class="macro-item macro-c"><span>Carbs</span><strong id="total-carbs">0g</strong></div>
        <div class="macro-item macro-f"><span>Fat</span><strong id="total-fat">0g</strong></div>
    </div>

    <div class="main-grid">
        <!-- Khung Ăn Uống -->
        <div class="section">
            <h2>Nhật ký ăn uống</h2>
            <label class="ai-camera-btn" for="camera-input">📷 CHỤP ẢNH ĐỒ ĂN (AI Phân tích)</label>
            <input type="file" id="camera-input" accept="image/*" capture="environment">
            <div id="ai-status">⏳ Đang gửi ảnh lên trạm AI...</div>

            <form class="form-group" id="food-form">
                <input type="text" id="food-name" placeholder="Tên món ăn (VD: Phở bò)" required>
                <input type="number" id="food-cal" placeholder="Số calo (kcal)" required>
                <div class="macro-inputs">
                    <input type="number" id="food-p" placeholder="Đạm (g)">
                    <input type="number" id="food-c" placeholder="Tinh bột (g)">
                    <input type="number" id="food-f" placeholder="Béo (g)">
                </div>
                <button type="submit" class="btn-add-food">Thêm món ăn</button>
            </form>

            <div class="list-header">Danh sách đã nạp</div>
            <ul id="food-list"></ul>
        </div>

        <!-- Khung Tập Luyện -->
        <div class="section">
            <h2>Kế hoạch tập luyện</h2>
            <form class="form-group" id="workout-form">
                <div class="workout-inputs">
                    <input type="text" id="workout-name" placeholder="VD: Chạy bộ 30 phút" required style="flex: 1;">
                    <button type="button" id="btn-ai-workout" class="btn-ai-calc">🤖 AI Tính</button>
                </div>
                <input type="number" id="workout-cal" placeholder="Calo tiêu hao (kcal)" required>
                <button type="submit" class="btn-add-workout">Thêm bài tập</button>
            </form>
            <div class="list-header">Danh sách đã tập</div>
            <ul id="workout-list"></ul>
        </div>
    </div>
</div>

<script>
    // 1. CHÀO HỎI TỰ ĐỘNG THEO GIỜ
    function setGreeting() {
        const hour = new Date().getHours();
        let greeting = "Chào buổi sáng! Sẵn sàng cho một ngày khỏe mạnh chưa? 🌅";
        if (hour >= 12 && hour < 18) {
            greeting = "Chào buổi chiều! Đừng quên nạp đủ nước nhé! ☀️";
        } else if (hour >= 18) {
            greeting = "Chào buổi tối! Chúc bạn có một bữa ăn ngon miệng và thư giãn! 🌙";
        }
        document.getElementById('greeting-text').innerText = greeting;
    }
    setGreeting();

    // 2. KHỞI TẠO DỮ LIỆU
    let foods = JSON.parse(localStorage.getItem('foods')) || [];
    let workouts = JSON.parse(localStorage.getItem('workouts')) || [];

    // 3. XỬ LÝ FORM THÊM THỦ CÔNG
    document.getElementById('food-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('food-name').value;
        const cal = parseInt(document.getElementById('food-cal').value) || 0;
        const p = parseInt(document.getElementById('food-p').value) || 0;
        const c = parseInt(document.getElementById('food-c').value) || 0;
        const f = parseInt(document.getElementById('food-f').value) || 0;
        
        foods.push({ id: Date.now(), name, cal, p, c, f });
        saveData(); updateUI(); this.reset();
        document.getElementById('ai-status').style.display = 'none';
    });

    document.getElementById('workout-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('workout-name').value;
        const cal = parseInt(document.getElementById('workout-cal').value);
        workouts.push({ id: Date.now(), name, cal });
        saveData(); updateUI(); this.reset();
    });

    // 4. XOÁ DỮ LIỆU VÀ CẬP NHẬT GIAO DIỆN
    function deleteItem(type, id) {
        if (type === 'food') foods = foods.filter(item => item.id !== id);
        else workouts = workouts.filter(item => item.id !== id);
        saveData(); updateUI();
    }

    function saveData() {
        localStorage.setItem('foods', JSON.stringify(foods));
        localStorage.setItem('workouts', JSON.stringify(workouts));
    }

    function updateUI() {
        const foodListElement = document.getElementById('food-list');
        const workoutListElement = document.getElementById('workout-list');
        foodListElement.innerHTML = ''; workoutListElement.innerHTML = '';
        
        let totalIn = 0, totalOut = 0, totalP = 0, totalC = 0, totalF = 0;

        foods.forEach(food => {
            totalIn += food.cal;
            totalP += food.p || 0; totalC += food.c || 0; totalF += food.f || 0;
            foodListElement.innerHTML += `
                <li>
                    <div class="item-details">
                        <span>${food.name}</span>
                        <div class="item-macros">P: ${food.p||0}g | C: ${food.c||0}g | F: ${food.f||0}g</div>
                    </div>
                    <div>
                        <strong>+${food.cal} kcal</strong>
                        <button class="del-btn" onclick="deleteItem('food', ${food.id})">×</button>
                    </div>
                </li>`;
        });

        workouts.forEach(workout => {
            totalOut += workout.cal;
            workoutListElement.innerHTML += `
                <li>
                    <span>${workout.name}</span>
                    <div><strong>-${workout.cal} kcal</strong><button class="del-btn" onclick="deleteItem('workout', ${workout.id})">×</button></div>
                </li>`;
        });

        document.getElementById('total-in').innerText = `${totalIn} kcal`;
        document.getElementById('total-out').innerText = `${totalOut} kcal`;
        document.getElementById('total-net').innerText = `${totalIn - totalOut} kcal`;
        document.getElementById('total-protein').innerText = `${totalP}g`;
        document.getElementById('total-carbs').innerText = `${totalC}g`;
        document.getElementById('total-fat').innerText = `${totalF}g`;
    }

    // 5. GỌI AI PHÂN TÍCH HÌNH ẢNH MÓN ĂN
    document.getElementById('camera-input').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const statusNode = document.getElementById('ai-status');
        statusNode.style.display = 'block';
        statusNode.innerText = '⏳ Đang gửi ảnh lên trạm AI...';

        const reader = new FileReader();
        reader.onloadend = async function() {
            const base64String = reader.result.split(',')[1]; 
            try {
                const response = await fetch('https://app-tinh-calo.vercel.app/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ imageBase64: base64String })
                });

                const data = await response.json();
                if (data.name && data.cal) {
                    document.getElementById('food-name').value = data.name;
                    document.getElementById('food-cal').value = data.cal;
                    document.getElementById('food-p').value = data.protein || 0;
                    document.getElementById('food-c').value = data.carbs || 0;
                    document.getElementById('food-f').value = data.fat || 0;
                    statusNode.innerText = '✅ Phân tích xong! Vui lòng bấm "Thêm món ăn"';
                } else {
                    statusNode.innerText = '❌ AI không nhận diện được món ăn.';
                }
            } catch (error) {
                statusNode.innerText = '❌ Lỗi kết nối đến máy chủ AI!';
            }
            e.target.value = ""; 
        };
        reader.readAsDataURL(file);
    });

    // 6. GỌI AI TÍNH CALO BÀI TẬP
    document.getElementById('btn-ai-workout').addEventListener('click', async function() {
        const workoutName = document.getElementById('workout-name').value;
        if (!workoutName) {
            alert("Vui lòng nhập tên bài tập trước (VD: Đạp xe 5km)!");
            return;
        }

        const btn = this;
        const originalText = btn.innerText;
        btn.innerText = "⏳ Đang tính...";
        btn.disabled = true;

        try {
            const response = await fetch('https://app-tinh-calo.vercel.app/api/workout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ workoutName })
            });

            const data = await response.json();
            if (data.cal) {
                document.getElementById('workout-cal').value = data.cal;
                btn.innerText = "✅ Xong";
            } else {
                btn.innerText = "❌ Lỗi";
            }
        } catch (error) {
            btn.innerText = "❌ Lỗi mạng";
        }

        setTimeout(() => {
            btn.innerText = originalText;
            btn.disabled = false;
        }, 2000);
    });

    // Chạy UI lần đầu
    updateUI();
</script>

</body>
</html>
